<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omega Service - Laudo Digital</title>
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

  <!-- TELA DE LOGIN -->
  <section id="telaLogin" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="text-center">
        <h1 class="text-xl font-black text-slate-800">Laudo LP Digital</h1>
        <p class="text-xs text-slate-500">Omega Service • Acesso Restrito</p>
      </div>
      
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
        <div class="flex justify-between items-center mb-2">
            <label class="text-xs font-bold text-slate-700">Inspetor:</label>
            <button type="button" onclick="iniciarNovoUsuarioLogin()" class="text-[10px] bg-red-600 text-white px-2 py-1 rounded">+ Novo</button>
        </div>
        <select id="selectUsuariosLogin" onchange="selecionarUsuarioNaTelaLogin(this.value)" class="w-full p-2 border rounded-lg text-sm"></select>
      </div>

      <input type="text" id="login_nome" placeholder="Nome Completo" class="w-full p-2 border rounded-lg text-sm">
      <input type="text" id="login_snqc" placeholder="Registro / SNQC (Ex: 12345678)" class="w-full p-2 border rounded-lg text-sm">
      
      <div class="p-2 border rounded-lg bg-slate-50 grid grid-cols-3 gap-2">
          <label class="text-[10px] font-medium"><input type="checkbox" name="qualif_check" value="LP"> LP</label>
          <label class="text-[10px] font-medium"><input type="checkbox" name="qualif_check" value="ME"> ME</label>
          <label class="text-[10px] font-medium"><input type="checkbox" name="qualif_check" value="EVS"> EVS</label>
          <label class="text-[10px] font-medium"><input type="checkbox" name="qualif_check" value="US"> US</label>
          <label class="text-[10px] font-medium"><input type="checkbox" name="qualif_check" value="PM"> PM</label>
          <label class="text-[10px] font-medium"><input type="checkbox" name="qualif_check" value="IEQ"> IEQ</label>
      </div>

      <input type="password" id="login_senha" placeholder="Senha Obrigatória" class="w-full p-2 border rounded-lg text-sm">
      <button onclick="confirmarAcessoApp()" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl text-sm">Entrar no Sistema</button>
    </div>
  </section>

  <!-- AREA PRINCIPAL (Escondida até o Login) -->
  <div id="areaPrincipalApp" class="hidden p-4">
    <!-- Restante do seu formulário vai aqui -->
    <h2 class="text-lg font-bold">Sistema de Laudos</h2>
    <button onclick="voltarParaLogin()" class="text-xs bg-slate-800 text-white px-4 py-2 rounded">Sair / Trocar Usuário</button>
  </div>

  <script>
    let usuarioLogado = null;
    let listaUsuariosLocais = JSON.parse(localStorage.getItem('omega_usuarios_lista') || '[]');

    function inicializarTelaLogin() {
      const select = document.getElementById('selectUsuariosLogin');
      select.innerHTML = '<option value="NOVO">+ Cadastrar Novo Inspetor</option>';
      listaUsuariosLocais.forEach(u => select.innerHTML += `<option value="${u.snqc}">${u.nome}</option>`);
    }

    function iniciarNovoUsuarioLogin() {
      document.getElementById('login_nome').value = '';
      document.getElementById('login_snqc').value = '';
      document.getElementById('login_senha').value = '';
      document.querySelectorAll('input[name="qualif_check"]').forEach(c => c.checked = false);
    }

    function selecionarUsuarioNaTelaLogin(snqc) {
      if(snqc === "NOVO") return iniciarNovoUsuarioLogin();
      const u = listaUsuariosLocais.find(x => x.snqc === snqc);
      if(u) {
        document.getElementById('login_nome').value = u.nome;
        document.getElementById('login_snqc').value = u.snqc;
        document.getElementById('login_senha').value = u.senha || '';
        document.querySelectorAll('input[name="qualif_check"]').forEach(c => c.checked = u.qualif.includes(c.value));
      }
    }

    async function confirmarAcessoApp() {
        const nome = document.getElementById('login_nome').value;
        const snqc = document.getElementById('login_snqc').value;
        const senha = document.getElementById('login_senha').value;
        if (!nome || !snqc || !senha) return alert("Preencha todos os campos, incluindo a senha!");

        const qualifs = Array.from(document.querySelectorAll('input[name="qualif_check"]:checked')).map(c => c.value).join(' / ');
        
        // Salvar usuário localmente
        const usr = { id: 'USR-'+Date.now(), nome, snqc, qualif: qualifs, senha };
        localStorage.setItem('omega_user', JSON.stringify(usr));
        
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('areaPrincipalApp').classList.remove('hidden');
        alert("Acesso liberado!");
    }

    function voltarParaLogin() {
        window.location.reload();
    }

    window.onload = inicializarTelaLogin;
  </script>
</body>
</html>
