<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>PWA Laudo LP - Omega Service</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Dexie.js for IndexedDB Offline Storage -->

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @media screen and (max-width: 768px) {
      input, select, textarea { font-size: 16px !important; }
    }
    .touch-target { min-height: 42px; }
    
    .print-only { 
      display: none !important; 
    }

    @page { 
      size: A4 portrait; 
      margin: 5mm; 
    }
    
    @media print {
      html, body {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
        font-family: Arial, Helvetica, sans-serif !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      #printArea { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .report-container {
        border: 2px solid #000 !important;
        width: 100% !important;
        height: 284mm !important;
        max-height: 284mm !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
        margin: 0 !important;
      }
      .report-container:last-child { 
        page-break-after: auto !important; 
        break-after: auto !important; 
      }
      table { width: 100% !important; border-collapse: collapse !important; }
      table, th, td { border: 1px solid #000 !important; }
      .inutilizacao-area {
        flex-grow: 1 !important;
        min-height: 20mm !important;
        position: relative !important;
        background: #fff !important;
        border-bottom: 2px solid #000 !important;
      }
    }
  </style>
</head>
